name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and check the extension
        shell: pwsh
        run: |
          ./build.ps1
          node --test ./src/extension.test.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: Afterglow-Windows-x64
          path: portable/**
